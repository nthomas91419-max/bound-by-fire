<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bound by Fire</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 80%, #5c1c0b 0%, #1a0d0a 30%, #050505 70%);
      color: #f5efe6;
      font-family: Georgia, "Times New Roman", serif;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;
      overflow: hidden;
    }

    .game-container {
      width: 90%;
      max-width: 900px;
      padding: 40px 20px;
    }

    .dragon-symbol {
      font-size: 70px;
      margin-bottom: 20px;
      animation: breathe 3s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(50px, 10vw, 100px);
      letter-spacing: 8px;
      text-transform: uppercase;

      background: linear-gradient(
        180deg,
        #fff3c4,
        #e99a46,
        #9e2f16
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 20px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #d6b995;
      margin-bottom: 45px;
    }

    .tagline {
      font-size: 24px;
      font-style: italic;
      margin-bottom: 45px;
      line-height: 1.5;
    }

    button {
      background: transparent;
      color: #f5efe6;

      border: 1px solid #d27736;
      padding: 16px 42px;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;

      letter-spacing: 4px;
      text-transform: uppercase;

      cursor: pointer;

      transition: 0.3s;
    }

    button:hover {
      background: #9e2f16;
      border-color: #ffb15c;
      transform: scale(1.05);
    }

    #message {
      margin-top: 35px;
      min-height: 40px;
      color: #d6b995;
      font-size: 18px;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        opacity: 0.7;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <main class="game-container">

    <div class="dragon-symbol">🐉</div>

    <h1>Bound by Fire</h1>

    <div class="subtitle">
      A Dragon Rider RPG
    </div>

    <p class="tagline">
      You don't choose your dragon.<br>
      Your choices do.
    </p>

    <button id="beginButton">
      Enter the Trials
    </button>

    <p id="message"></p>

  </main>

  <script>
    const beginButton = document.getElementById("beginButton");
    const message = document.getElementById("message");

    beginButton.addEventListener("click", function () {
      message.textContent =
        "Your choices will reveal who you are. And something is waiting to see what you become.";

      beginButton.textContent = "Begin";
    });
  </script>

</body>
</html>
